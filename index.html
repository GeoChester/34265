  {words:["BROOM", "CACHE", "CLUES", "CREEK", "CRYPT", "CURSE", "EERIE", "GHOST", "GOURD", "GRAVE", "HAUNT", "NORTH", "RAVEN", "SKULL", "SPOOK", "STASH", "TRAIL", "TREAT", "TRICK", "WITCH"],step:890},
  {words:["BEACON", "CANDLE", "CAVERN", "CLOAKS", "COFFIN", "CREEPY", "FOREST", "GHOULS", "GOBLIN", "HIDDEN", "MUGGLE", "POTION", "PUZZLE", "SEEKER", "SHADOW", "SPIDER", "SPIRIT", "TOKENS", "WIZARD", "ZOMBIE"],step:830},
  {words:["BANSHEE", "COBWEBS", "COMPASS", "GEOCOIN", "GHOSTLY", "GOBLINS", "HAUNTED", "LANTERN", "LOGBOOK", "MUMMIES", "PHANTOM", "PUMPKIN", "SCREECH", "SORCERY", "SPECTRE", "SPIDERS", "TRINKET", "VAMPIRE", "WARLOCK", "WHISPER"],step:770},
  {words:["CATACOMB", "CAULDRON", "CEMETERY", "GARGOYLE", "GHOULISH", "HALLOWED", "HAUNTING", "HIDEAWAY", "MIDNIGHT", "MOONBEAM", "MOONLESS", "PHANTOMS", "PUMPKINS", "SKELETON", "SORCERER", "SPECTRAL", "TRACKERS", "TREASURE", "WAYPOINT", "WEREWOLF"],step:710}
];

/* ---------- the board ---------- */
const NS="http://www.w3.org/2000/svg",svg=$("svg");
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;};
svg.innerHTML=`<defs>
  <radialGradient id="woodG" cx=".5" cy=".45" r=".75"><stop offset="0" stop-color="#d8b483"/><stop offset=".55" stop-color="#b88a55"/><stop offset="1" stop-color="#6a3c1a"/></radialGradient>
  <pattern id="grainP" width="600" height="18" patternUnits="userSpaceOnUse"><path d="M0 6 C150 2 300 10 600 5 M0 14 C200 17 380 11 600 15" stroke="#5a2e10" stroke-opacity=".18" fill="none" stroke-width="1.4"/></pattern>
  <filter id="glowF" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="lensG" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff8e0" stop-opacity=".55"/><stop offset=".6" stop-color="#ffd28a" stop-opacity=".15"/><stop offset="1" stop-color="#3a1d08" stop-opacity=".35"/></radialGradient>
  <linearGradient id="planG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2e6cc"/><stop offset="1" stop-color="#bfa57a"/></linearGradient>
</defs>
<rect x="6" y="6" width="588" height="408" rx="38" fill="url(#woodG)" stroke="#2a1406" stroke-width="4"/>
<rect x="6" y="6" width="588" height="408" rx="38" fill="url(#grainP)"/>
<rect x="20" y="20" width="560" height="380" rx="28" fill="none" stroke="#3a1d0a" stroke-width="2" opacity=".6"/>
<g fill="#3a1d0a" opacity=".85">
  <circle cx="300" cy="62" r="20"/><circle cx="292" cy="58" r="20" fill="url(#woodG)"/>
</g>`;
const POS={};
// letters on two arcs, numbers in a row, YES / NO in the top corners, GOODBYE at the foot
function arc(str,cy,R,span,size){const n=str.length;[...str].forEach((ch,i)=>{const a=-Math.PI/2+(i-(n-1)/2)*span/(n-1);
  const x=300+Math.cos(a)*R*1.55,y=cy+R+Math.sin(a)*R,rot=a*180/Math.PI+90;POS[ch]={x,y,rot,size};});}
arc("ABCDEFGHIJKLM",128,250,1.28,40);arc("NOPQRSTUVWXYZ",208,250,1.24,40);
"1234567890".split("").forEach((d,i)=>{POS[d]={x:150+i*33.3,y:322,rot:0,size:28};});
POS.YES={x:96,y:66,rot:0,size:30};POS.NO={x:504,y:66,rot:0,size:30};POS.GOODBYE={x:300,y:384,rot:0,size:28};
const LTR={};
Object.keys(POS).forEach(k=>{const p=POS[k];
  const t=el("text",{x:p.x,y:p.y,"text-anchor":"middle","dominant-baseline":"central","font-size":p.size,class:"ltr",transform:`rotate(${p.rot} ${p.x} ${p.y})`});t.textContent=k==="GOODBYE"?"GOOD BYE":k;LTR[k]=t;
  if(k.length===1&&k>="A"){const h=el("circle",{cx:p.x,cy:p.y,r:21,class:"hit",tabindex:"0",role:"button","aria-label":"Letter "+k});
    h.addEventListener("click",()=>pick(k));h.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(k);}});}});
document.addEventListener("keydown",e=>{if(/^[a-z]$/i.test(e.key)&&!e.metaKey&&!e.ctrlKey&&!e.altKey)pick(e.key.toUpperCase());});
const plan=el("g",{transform:"translate(300 250)"});
plan.innerHTML=`<path d="M0 -50 C26 -50 44 -20 44 8 C44 34 24 48 0 52 C-24 48 -44 34 -44 8 C-44 -20 -26 -50 0 -50Z" fill="url(#planG)" stroke="#3a1d0a" stroke-width="3" opacity=".93"/>
<circle cx="0" cy="-8" r="17" fill="url(#lensG)" stroke="#3a1d0a" stroke-width="3"/>
<circle cx="-28" cy="34" r="4" fill="#3a1d0a"/><circle cx="28" cy="34" r="4" fill="#3a1d0a"/><circle cx="0" cy="44" r="4" fill="#3a1d0a"/>`;
plan.style.pointerEvents="none";
// the lens sits 8 units above the planchette's centre, so park the centre just below the target
let px=300,py=250,pr=0;
function placePlan(x,y,r){px=x;py=y;pr=r;plan.setAttribute("transform",`translate(${x.toFixed(1)} ${(y+5.8).toFixed(1)}) rotate(${r.toFixed(1)}) scale(.72)`);}
placePlan(300,232,0);
let gen=0;
function glide(to,dur,tok){return new Promise(res=>{const p=POS[to]||to,x0=px,y0=py,r0=pr,x1=p.x,y1=p.y,r1=(Math.random()-.5)*16;
  if(reduce)dur=Math.min(dur,150);scrape(dur);const t0=performance.now();
  (function f(now){if(tok!==gen)return res(false);const u=Math.min(1,(now-t0)/dur),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,w=Math.sin(u*Math.PI)*(reduce?0:6);
    placePlan(x0+(x1-x0)*e+w*Math.sin(now/90),y0+(y1-y0)*e+w*Math.cos(now/110),r0+(r1-r0)*e);if(u<1)requestAnimationFrame(f);else res(true);})(t0);});}
const wait=(ms,tok)=>new Promise(r=>setTimeout(()=>r(tok===gen),ms));
function lit(k,on){if(LTR[k])LTR[k].classList.toggle("lit",on);}

/* ---------- candles and word line ---------- */
$("strikes").innerHTML=`<svg viewBox="0 0 20 30" aria-hidden="true"><path class="fl" d="M10 1C14 7 15 10 10 14C5 10 6 7 10 1Z"/><rect x="6" y="15" width="8" height="14" rx="1.5"/></svg>`.repeat(3);
function setStrikes(){[...$("strikes").children].forEach((e,i)=>e.classList.toggle("out",i<strikes));$("strikes").setAttribute("aria-label",`${3-strikes} of 3 candles lit`);}
function setLevels(){[...$("levels").children].forEach((e,i)=>{e.classList.toggle("done",i<lv||phase==="won");e.classList.toggle("cur",i===lv&&phase!=="won");});}
function drawWord(badAt){$("word").innerHTML=[...word].map((c,i)=>`<span${i===badAt?' class="bad"':""}>${i<typed.length?typed[i]:i===badAt?"✕":""}</span>`).join("");
  $("word").setAttribute("aria-label",`${typed.length} of ${word.length} letters spelled`);}
const say=(t,bad)=>{$("msg").textContent=t;$("msg").classList.toggle("bad",!!bad);};

/* ---------- sounds of the board ---------- */
function scrape(ms){if(!ctx||ms<120)return;const t=ctx.currentTime,s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),a=ctx.createGain(),d=ms/1000;s.buffer=noiseBuf;s.loop=true;
  f.type="bandpass";f.frequency.value=700;f.Q.value=1.2;a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(.05,t+d*.3);a.gain.linearRampToValueAtTime(0,t+d);s.connect(f);f.connect(a);a.connect(master);s.start(t,Math.random());s.stop(t+d+.05);}
function chime(i){if(!ctx)return;const t=ctx.currentTime;bell(t,72+[0,3,7,10,12,15,19,22][i%8],echoIn,.07);note(84+[0,3,7,10,12][i%5],t,.6,"sine",.05,master);}
function toll(){if(!ctx)return;const t=ctx.currentTime+.02;bell(t,38,master,.16);bell(t,38,echoIn,.1);note(43,t,1.2,"sawtooth",.03,master);}
function levelChime(){initAudio();if(!ctx)return;const t=ctx.currentTime+.05;[62,65,69,74,77,81].forEach((m,i)=>bell(t+i*.13,m,master,.08));note(50,t,1.6,"sawtooth",.03,master);sweep(t+.2,echoIn);}

/* ---------- the game ---------- */
let lv=0,word="",typed="",strikes=0,phase="idle",askLeft=1,lastWord="";
function startLevel(n){
  gen++;const tok=gen;lv=n;strikes=0;typed="";askLeft=1;setStrikes();
  const pool=LEVELS[n].words.filter(w=>w!==lastWord);word=pool[Math.floor(Math.random()*pool.length)];lastWord=word;
  phase="show";setLevels();drawWord();$("again").hidden=false;$("again").disabled=true;
  Object.keys(LTR).forEach(k=>lit(k,false));
  say(["The first spirit stirs…","A second spirit draws near…","A third spirit whispers…","A fourth spirit knocks…","The oldest spirit rises…"][n]);
  wait(1100,tok).then(ok=>ok&&spell(tok));
}
async function spell(tok){
  phase="show";$("again").disabled=true;const step=LEVELS[lv].step;
  for(const ch of word){if(!await glide(ch,step*.62,tok))return;lit(ch,true);chime(0);if(!await wait(step*.38,tok))return;lit(ch,false);}
  if(!await glide({x:300,y:232},500,tok))return;
  phase="input";$("again").disabled=askLeft<1;say("Your turn. Spell what the spirit said.");
}
async function pick(ch){
  if(phase!=="input")return;initAudio();const tok=gen,want=word[typed.length];
  phase="busy";
  await glide(ch,260,tok);if(tok!==gen)return;
  if(ch===want){typed+=ch;drawWord();lit(ch,true);chime(typed.length);setTimeout(()=>lit(ch,false),400);
    if(typed.length===word.length){levelDone(tok);return;}
    phase="input";return;}
  strikes++;setStrikes();drawWord(typed.length);toll();
  await glide("NO",420,tok);if(tok!==gen)return;lit("NO",true);
  if(strikes>=3){fail(tok);return;}
  say(strikes===1?"NO. The spirit is displeased. Two candles remain.":"NO! One candle left…",true);
  await wait(900,tok);if(tok!==gen)return;lit("NO",false);drawWord();await glide({x:300,y:232},350,tok);if(tok!==gen)return;
  phase="input";
}
async function levelDone(tok){
  phase="busy";$("again").disabled=true;await wait(300,tok);if(tok!==gen)return;
  await glide("YES",600,tok);if(tok!==gen)return;lit("YES",true);
  if(lv<LEVELS.length-1){levelChime();say("YES. The spirit is satisfied, and fades away.");
    await wait(2600,tok);if(tok!==gen)return;startLevel(lv+1);}
  else finale(tok);
}
// three candles out: the board turns on you, then the same séance begins again with a new word
async function fail(tok){
  phase="busy";$("again").disabled=true;say("The last candle dies. The spirit is angry!",true);
  if(ctx){const t=ctx.currentTime;[33,34,39,45].forEach((m,i)=>note(m,t,1.6,"sawtooth",.07,master,i*7));bell(t+.2,36,echoIn,.2);}
  if(!reduce){document.body.classList.remove("scare");void document.body.offsetWidth;document.body.classList.add("scare");}
  for(let i=0;i<5&&!reduce;i++){const ks=Object.keys(POS);if(!await glide(ks[Math.floor(Math.random()*ks.length)],180,tok))return;}
  await wait(900,tok);if(tok!==gen)return;document.body.classList.remove("scare");lit("NO",false);
  say("You may try this séance again.");await wait(1200,tok);if(tok!==gen)return;startLevel(lv);
}
async function finale(tok){
  phase="won";setLevels();$("again").hidden=true;victory();if(musicOn){musicOn=Music.toggle();setMusic();}
  say("You have proven yourself to the spirits.");
  await wait(1200,tok);if(tok!==gen)return;await glide("GOODBYE",1400,tok);if(tok!==gen)return;lit("GOODBYE",true);
  Object.keys(LTR).forEach((k,i)=>{LTR[k].style.setProperty("--d",(-Math.random()*2.2).toFixed(2)+"s");if(k!=="GOODBYE")LTR[k].classList.add("twinkle");});
  await wait(1600,tok);if(tok!==gen)return;
  $("ask").hidden=false;$("reply").hidden=false;$("ask").textContent="“Are you ready?”";$("reply").textContent="";$("dareIn").value="";$("dare").hidden=false;$("opts").hidden=true;$("haunt").hidden=false;
  $("haunt").scrollIntoView({behavior:reduce?"auto":"smooth",block:"center"});
}
// the ghost's two questions stand between the player and the coordinates
$("dare").addEventListener("submit",e=>{e.preventDefault();if(phase!=="won")return;const a=$("dareIn").value.trim();
  if(/^y(es)?\b/i.test(a)){initAudio();chime(3);$("dare").hidden=true;$("reply").textContent="";$("ask").textContent="“Are you afraid of the dark?”";$("opts").hidden=false;$("opts").querySelector("button").focus();}
  else{toll();$("reply").textContent=a?"Then turn back, mortal… unless you find your courage.":"The ghost waits for your answer.";$("dareIn").select();}});
$("opts").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||phase!=="won")return;
  if(b.dataset.a==="yes"){toll();$("reply").textContent="Then the dark is no place for you. Stay by the candle.";return;}
  showCoords();});
function showCoords(){
  const phrase=unlock(SEALED,"planchette|chester-board|3");
  $("opts").hidden=true;$("reply").textContent="";$("reply").hidden=true;$("ask").hidden=true;
  $("kp").textContent=phrase;$("coords").hidden=false;levelChime();
  setTimeout(()=>{if(phase==="won"){$("replay").hidden=false;$("coords").scrollIntoView({behavior:reduce?"auto":"smooth",block:"center"});}},2200);
}
$("begin").addEventListener("click",()=>{initAudio();$("begin").hidden=true;startLevel(0);});
$("again").addEventListener("click",()=>{if(phase!=="input"||askLeft<1)return;askLeft--;say("The spirit spells it once more. Watch closely…");spell(gen);});
// Replay only appears when all five séances are done, and starts again from the first
$("replay").addEventListener("click",()=>{$("replay").hidden=true;$("coords").hidden=true;$("haunt").hidden=true;Object.values(LTR).forEach(t=>t.classList.remove("twinkle","lit"));placePlan(300,232,0);startLevel(0);scrollTo({top:0,behavior:reduce?"auto":"smooth"});});

/* ---------- music ---------- */
function setMusic(){const b=$("musicBtn");b.setAttribute("aria-pressed",musicOn);b.textContent=musicOn?"♪ Music on":"♪ Music off";}
$("musicBtn").addEventListener("click",()=>{musicOn=Music.toggle();setMusic();});

setStrikes();setLevels();
window.__sb={get word(){return word;},get phase(){return phase;},pick};
})();
</script>
