<title>Trick</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra+SC&family=Almendra:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one centred column — title, level dots and candles, the word being spelled, the spirit board (an aged wooden board with arched letters), a status line and the buttons */
:root{
  --night:#0f0a18; --plum:#24153a; --line:#4a3766;
  --amber:#ffcf86; --candle:#ffb347; --ink:#e9dcc0; --muted:#a8946f; --ghost:#b8ffc9; --bad:#ff7a6a;
  --wood:#6a3c1a; --wood-d:#3a1d0a; --letter:#2a1406;
  --display:'Almendra SC','Palatino Linotype',Georgia,serif;
  --text:'Almendra','Palatino Linotype',Georgia,serif;
  --mono:'Share Tech Mono','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,#2b1a45 0%,var(--night) 60%) fixed,var(--night);color:var(--ink);font:17px/1.45 var(--text);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body.scare{animation:scare .9s steps(2) 2}
@keyframes scare{0%{background-color:#3a0608}50%{background-color:#000}}
.page{max-width:680px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:9px;padding-block:50px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.music{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:20;font-family:var(--display);font-size:15px;background:rgba(36,21,58,.9);color:var(--muted);border:1px solid #5a4378;border-radius:999px;padding:7px 14px;cursor:pointer}
.music[aria-pressed="true"]{color:var(--amber);border-color:#c98a3a;box-shadow:0 0 12px rgba(255,160,60,.35)}
button:focus-visible,.hit:focus-visible{outline:2px solid var(--ghost);outline-offset:2px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,8.5vw,50px);margin:0;letter-spacing:.03em;color:var(--amber);text-shadow:0 0 18px rgba(255,150,40,.45),0 2px 0 #3a1d08;text-align:center;line-height:1.05;text-wrap:balance;cursor:default;-webkit-user-select:none;user-select:none}
.status-row{display:flex;align-items:center;gap:22px}
.levels{display:flex;gap:10px}
.levels span{width:12px;height:12px;border-radius:50%;background:#1e1530;box-shadow:inset -4px 0 0 #0a0612;transition:background .6s,box-shadow .6s}
.levels span.cur{background:#7a5a2a;box-shadow:inset -4px 0 0 #2a1a08,0 0 8px rgba(255,179,71,.5)}
.levels span.done{background:var(--amber);box-shadow:0 0 10px rgba(255,179,71,.9)}
.strikes{display:flex;gap:12px}
.strikes svg{width:16px;height:24px}
.strikes rect{fill:#d9cfe8}
.strikes .fl{fill:#ffb347;filter:drop-shadow(0 0 4px #ff8a1f);transition:opacity .4s}
.strikes svg.out .fl{opacity:0}
.strikes svg.out rect{fill:#4a3a5a}
.word{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:40px;font-family:var(--mono);font-size:clamp(22px,6vw,30px)}
.word span{width:1.15em;border-bottom:2px solid #5a4378;text-align:center;color:var(--amber);text-shadow:0 0 10px rgba(255,180,80,.6);line-height:1.3}
.word span.bad{color:var(--bad);border-color:var(--bad);text-shadow:0 0 10px rgba(255,80,60,.6)}

.board{position:relative;width:100%;max-width:640px;aspect-ratio:600/420}
.board svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.hit{cursor:pointer;fill:transparent}
.ltr{font-family:var(--display);fill:var(--letter);pointer-events:none;transition:fill .25s}
.ltr.lit{fill:#fff3d0;filter:url(#glowF)}
.ltr.twinkle{animation:twinkle 2.2s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes twinkle{0%,100%{fill:var(--letter)}50%{fill:#ffe9b0}}
.msg{margin:4px 0 0;min-height:2.7em;text-align:center;font-family:'EB Garamond','Garamond','Palatino Linotype',Georgia,serif;font-weight:500;font-size:clamp(21px,5.8vw,25px);line-height:1.3;letter-spacing:.01em;color:#eadcc0;max-width:30ch;text-wrap:balance}
.msg.bad{color:var(--bad)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.primary{font-family:var(--display);font-size:20px;letter-spacing:.05em;padding:11px 24px;min-height:48px;border-radius:999px;border:1px solid #c98a3a;background:linear-gradient(#5b3216,#3a1d08);color:var(--amber);cursor:pointer;box-shadow:0 0 16px rgba(255,160,60,.3)}
.ghostbtn{font-family:var(--display);font-size:17px;padding:9px 18px;min-height:44px;border-radius:999px;border:1px solid #5a4378;background:transparent;color:var(--muted);cursor:pointer}
.ghostbtn:disabled{opacity:.4;cursor:default}
.coords{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--mono);font-size:clamp(28px,8vw,42px);letter-spacing:.06em;animation:flick 2.4s ease-out}
.coord-n{color:#8dff88;text-shadow:0 0 8px rgba(141,255,136,.9),0 0 22px rgba(80,255,90,.55);animation:glow 3s ease-in-out infinite}
.coord-w{color:#ffab55;text-shadow:0 0 8px rgba(255,171,85,.9),0 0 22px rgba(255,120,30,.55);animation:glow 3s ease-in-out infinite .6s}
@keyframes glow{50%{filter:brightness(1.25)}}
@keyframes flick{0%{opacity:0}10%{opacity:.8}14%{opacity:.1}22%{opacity:.9}26%{opacity:.2}40%,100%{opacity:1}}
.admin{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(8,6,14,.88);padding:0 16px}
.acard{width:min(100%,320px);background:#1b1626;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;font-family:var(--text)}
.acard label{font-family:var(--display);font-size:1.3rem}
.acard input{font:inherit;font-size:18px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#0c0a12;color:var(--ink)}
.arow{display:flex;gap:8px;justify-content:flex-end}
.arow button{font-family:var(--display);font-size:16px;min-height:44px;padding:6px 16px;border-radius:999px;border:1px solid var(--candle);background:transparent;color:var(--ink);cursor:pointer}
.acard p{margin:0;min-height:1.2em;font-size:15px;color:var(--bad);font-style:italic}
.haunt{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:420px;text-align:center;animation:flick 2.4s ease-out}
.haunt .spook{width:96px;height:112px;animation:hover 3.2s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(220,255,235,.55))}
.haunt .spook .eye{animation:eyeglow 2.6s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes eyeglow{0%,100%{fill:#1a1324}50%{fill:#3a7a55}}
.ask{margin:0;font-family:'EB Garamond','Garamond','Palatino Linotype',Georgia,serif;font-weight:600;font-style:italic;font-size:clamp(24px,6.6vw,30px);line-height:1.2;color:#f2f7f4;text-shadow:0 0 14px rgba(200,255,220,.45);text-wrap:balance}
.reply{margin:0;min-height:1.4em;font-family:'EB Garamond','Garamond',Georgia,serif;font-weight:500;font-size:20px;color:var(--bad)}
.dare{display:flex;gap:8px;width:100%;justify-content:center}
.dare input{flex:1;min-width:0;max-width:220px;font:500 21px 'EB Garamond','Garamond',Georgia,serif;padding:9px 14px;border-radius:999px;border:1px solid #5a4378;background:#140b22;color:var(--ink);text-align:center}
.dare input:focus-visible{outline:2px solid var(--ghost);outline-offset:2px}
.opts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.opts button{font:500 21px 'EB Garamond','Garamond',Georgia,serif;padding:10px 18px;min-height:48px;border-radius:999px;border:1px solid #5a4378;background:rgba(36,21,58,.8);color:var(--ink);cursor:pointer}
.opts button:hover{border-color:var(--ghost);color:#fff}
.gmap{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:8px}
.gmap h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(26px,7vw,34px);color:var(--amber);text-shadow:0 0 14px rgba(255,150,40,.4)}
.gmap svg{width:100%;height:auto;display:block;filter:drop-shadow(0 12px 26px rgba(0,0,0,.6))}
.gmap .ink{fill:none;stroke:#4a2a10;stroke-linecap:round;stroke-linejoin:round}
.gmap .lab{font-family:'EB Garamond','Garamond',Georgia,serif;font-style:italic;font-weight:600;fill:#3a1d08}
.gmap .num{font-family:'EB Garamond','Garamond',Georgia,serif;font-weight:600;fill:#f4e4c0;font-size:17px}
.gmap .stp{opacity:0}
.gmap.on .stp{animation:inkin .9s ease-out forwards;animation-delay:var(--d)}
@keyframes inkin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.gmap ol{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px;width:100%;font-family:'EB Garamond','Garamond',Georgia,serif;font-weight:500;font-size:clamp(19px,5vw,21px);line-height:1.35;color:#eadcc0}
.gmap li{counter-increment:s;display:flex;gap:12px;align-items:baseline}
.gmap li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:#7a1f12;color:#f4e4c0;font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;transform:translateY(-2px)}
.gmap .care{margin:0;font-family:'EB Garamond','Garamond',Georgia,serif;font-style:italic;font-size:17px;color:var(--muted);text-align:center;max-width:40ch}
.cloak{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;overflow-y:auto;
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(90% 60% at 50% 30%,#241536 0%,#0a0710 70%) #0a0710;transition:transform 1.6s cubic-bezier(.6,0,.4,1),opacity 1.6s}
.cloak.lift{transform:translateY(-110%);opacity:0;pointer-events:none}
.cloak .drape{cursor:default;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;width:min(70vw,260px);height:auto;animation:sway 6s ease-in-out infinite;filter:drop-shadow(0 18px 30px rgba(0,0,0,.7))}
.cloak .drape .eye{animation:eyeglow 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-8px)}}
.cloak h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,46px);color:var(--amber);text-shadow:0 0 18px rgba(255,150,40,.45);line-height:1.1;-webkit-user-select:none;user-select:none}
.cloak .say{margin:0;font-family:'EB Garamond','Garamond',Georgia,serif;font-weight:500;font-style:italic;font-size:clamp(22px,6vw,28px);line-height:1.25;color:#f2f7f4;text-shadow:0 0 14px rgba(200,255,220,.35);max-width:22ch;text-wrap:balance}
.count{display:flex;gap:10px;justify-content:center}
.count div{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:10px 6px 8px;border-radius:12px;border:1px solid #4a3766;background:rgba(36,21,58,.7)}
.count b{font:400 clamp(30px,9vw,44px)/1 var(--mono);color:#8dff88;text-shadow:0 0 10px rgba(141,255,136,.7);font-variant-numeric:tabular-nums}
.count span{margin-top:4px;font-family:'EB Garamond','Garamond',Georgia,serif;font-size:15px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.cloak .when{margin:0;font-family:'EB Garamond','Garamond',Georgia,serif;font-size:18px;color:var(--muted)}
.cloak form{display:flex;gap:8px}
.cloak input{font:18px 'EB Garamond',Georgia,serif;padding:8px 12px;border-radius:999px;border:1px solid #4a3766;background:#140b22;color:var(--ink);width:160px}
.cloak form button{font-family:var(--display);font-size:16px;padding:8px 16px;border-radius:999px;border:1px solid var(--candle);background:transparent;color:var(--ink);cursor:pointer}
body.cloaked{overflow:hidden}
@media (max-width:380px){.count div{min-width:56px}}
@media (prefers-reduced-motion:reduce){.cloak{transition:opacity .4s}.cloak.lift{transform:none}.cloak .drape,.cloak .drape .eye{animation:none}}
@media (prefers-reduced-motion:reduce){.gmap .stp{opacity:1;animation:none!important}body.scare,.coords,.coord-n,.coord-w,.ltr.twinkle,.haunt,.haunt .spook,.haunt .spook .eye{animation:none}}
</style>

<div class="cloak" id="cloak" role="dialog" aria-modal="true" aria-labelledby="cloakH">
  <svg class="drape" viewBox="0 0 200 230" aria-hidden="true">
    <defs><linearGradient id="cloakG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a52"/><stop offset=".6" stop-color="#22172f"/><stop offset="1" stop-color="#120c1a" stop-opacity=".9"/></linearGradient></defs>
    <path d="M100 6 C58 6 36 44 34 92 C30 150 14 190 4 226 C22 214 30 222 42 210 C54 224 64 214 76 224 C88 212 98 224 110 214 C122 226 132 212 144 222 C156 210 166 222 178 212 C186 218 192 220 196 226 C186 190 170 150 166 92 C164 44 142 6 100 6 Z" fill="url(#cloakG)" stroke="#0a0710" stroke-width="2"/>
    <path d="M100 18 C72 20 58 48 58 80 C58 104 76 118 100 118 C124 118 142 104 142 80 C142 48 128 20 100 18 Z" fill="#07040b"/>
    <ellipse class="eye" cx="84" cy="78" rx="6" ry="8" fill="#1a1324"/><ellipse class="eye" cx="116" cy="78" rx="6" ry="8" fill="#1a1324"/>
    <path d="M70 128 C72 170 66 196 60 220 M100 124 V222 M130 128 C128 170 134 196 140 220" stroke="#120c1a" stroke-width="2.4" fill="none" opacity=".8"/>
  </svg>
  <h2 id="cloakH">The board is sleeping</h2>
  <p class="say">“The ghost slumbers. Return on Halloween to wake it.”</p>
  <div class="count" role="timer" aria-live="off"><div><b id="cdD">0</b><span>days</span></div><div><b id="cdH">00</b><span>hours</span></div><div><b id="cdM">00</b><span>min</span></div><div><b id="cdS">00</b><span>sec</span></div></div>
</div>

<script>
/* the board stays covered: a countdown to Halloween, 31 Oct 2026 at 8:00 am Eastern (12:00 UTC), and nothing behind it */
(()=>{
  const OPEN=Date.UTC(2026,9,31,12,0,0),$=id=>document.getElementById(id);
  document.body.classList.add("cloaked");
  const pad=n=>String(n).padStart(2,"0");let iv;
  function tick(){const ms=Math.max(0,OPEN-Date.now());
    const t=Math.floor(ms/1000);$("cdD").textContent=Math.floor(t/86400);$("cdH").textContent=pad(Math.floor(t/3600)%24);$("cdM").textContent=pad(Math.floor(t/60)%60);$("cdS").textContent=pad(t%60);
    if(ms<=0)clearInterval(iv);}
  tick();iv=setInterval(tick,1000);
})();
</script>
